<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MP4 Player</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="player">

    <!-- ESQUERDA -->
    <div class="left-panel">

        <h3>Controles</h3>

        <label>Tempo</label>
        <input type="range" id="seekBar" min="0" max="100" value="0">

        <label>Volume</label>
        <input type="range" id="volumeBar" min="0" max="1" step="0.01" value="1">

    </div>

    <!-- CENTRO -->
    <div class="center">

        <!-- VÍDEO -->
        <div class="top-screen" id="videoContainer">

            <video id="videoPlayer"></video>

            <!-- FULLSCREEN CONTROLS -->
            <div class="fullscreen-ui">

                <div class="fs-bars">

                    <input type="range" id="fsSeekBar" min="0" max="100" value="0">
                    <input type="range" id="fsVolumeBar" min="0" max="1" step="0.01" value="1">

                </div>

                <div class="fs-buttons">

                    <button onclick="togglePlay()">⏯</button>
                    <button onclick="backward()">⏪</button>
                    <button onclick="forward()">⏩</button>
                    <button onclick="muteVideo()">🔇</button>
                    <button onclick="toggleFullscreen()">❌</button>

                </div>

            </div>

        </div>

        <!-- LISTA -->
        <div class="bottom-screen">

            <input type="file" id="videoInput" accept="video/mp4" multiple hidden>

            <button onclick="videoInput.click()">Carregar vídeos</button>

            <div id="videoList"></div>

        </div>

    </div>

    <!-- DIREITA -->
    <div class="right-panel">

        <h3>Player</h3>

        <button onclick="togglePlay()">Play/Pause</button>
        <button onclick="stopVideo()">Stop</button>
        <button onclick="backward()">-10s</button>
        <button onclick="forward()">+10s</button>
        <button onclick="muteVideo()">Mute</button>
        <button onclick="toggleFullscreen()">Tela Cheia</button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
